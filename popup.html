<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>🤖 Gemini Reply Generator</h1>
    
    <div class="status" id="status">Loading...</div>
    
    <div class="settings-section">
      <label for="apiKey">API Key:</label>
      <input type="password" id="apiKey" placeholder="Enter your Gemini API key" />
      <button id="saveBtn" class="btn btn-primary">Save API Key</button>
    </div>
    
    <div class="settings-section">
      <label for="tone">Reply Tone:</label>
      <select id="tone">
        <option value="professional">Professional</option>
        <option value="friendly">Friendly</option>
        <option value="casual">Casual</option>
        <option value="formal">Formal</option>
      </select>
    </div>
    
    <button id="settingsBtn" class="btn btn-secondary">Open Settings</button>
    <button id="testBtn" class="btn btn-secondary">Test API</button>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
